name: Work gallery preview validation
on:
  pull_request:
    paths:
      - 'src/pages/ux-gallery.astro'
      - 'public/images/ux-gallery/**'
      - '.github/workflows/ux-gallery-preview.yml'
  workflow_dispatch:
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check preview output and linked media
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, existsSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const file = 'dist/ux-gallery/index.html';
          assert(existsSync(file), 'Gallery route did not build');
          const html=readFileSync(file,'utf8');
          for (const text of ['Real Work','Playground','id="gallery"','id="focus"','aria-modal="true"']) {
            assert(html.includes(text), 'Missing '+text);
          }
          const media=[
            'images/ux-gallery/idl-plan.svg',
            'images/ux-gallery/idl-working.svg',
            'images/derived/idl-case-study-1400.webp',
            'images/earth-hero.png',
            'images/earth-hero/sketches.webp',
            'images/earth-hero/test-plan.webp',
            'images/Letter_River.png',
            'images/letterriverscreen.png'
          ];
          for (const src of media) assert(existsSync('dist/'+src), 'Missing media: '+src);
          console.log('Gallery output and',media.length,'media paths verified');
          NODE
