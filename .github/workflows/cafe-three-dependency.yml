name: Install café 3D dependency
on:
  push:
    branches:
      - claude/hopeful-albattani-puzzes
    paths:
      - .github/workflows/cafe-three-dependency.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-three:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add pinned Three.js dependency
        run: npm install --save-exact three@0.181.2 --package-lock-only
      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency already recorded"
          else
            git commit -m "build(cafe): pin Three.js renderer dependency"
            git push origin HEAD:claude/hopeful-albattani-puzzes
          fi
